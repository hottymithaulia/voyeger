  text:
    en:
      title: "Lower Lake (Chhota Talaab)"
      summary: "Lower Lake, locally called Chhota Talaab, is a late-18th-century urban lake situated directly east of Upper Lake in central Bhopal. Together with Bhojtal, it forms the internationally recognized Bhoj Wetland."
      story: "Commissioned in 1794 by Chote Khan, a minister under Nawab Hayat Muhammad Khan Bahadur, Lower Lake was created to beautify Bhopal by merging earlier wells behind a stone bridge-dam still known as Pul Pukhta. Separated from Upper Lake by an earthen embankment in a terraced arrangement, the lake receives subsurface seepage from Bhojtal and spans roughly 1.29 square kilometres within a dense urban catchment. Historically referenced in literature as Pukhta-Pul Talao, it sits at the junction of Old Bhopal's heritage quarter and newer administrative areas. Although part of the Ramsar-listed Bhoj Wetland, documented municipal drainage has placed the lake under ongoing ecological stress."
      tips: "Verify locally"
      needs_review: true
    hi:
      title: "लोअर लेक (छोटा तालाब)"
      summary: "लोअर लेक, जिसे स्थानीय रूप से छोटा तालाब कहा जाता है, मध्य भोपाल में अपर लेक के ठीक पूर्व में स्थित 18वीं सदी के उत्तरार्ध की शहरी झील है। भोजताल के साथ मिलकर यह अंतरराष्ट्रीय स्तर पर मान्यता प्राप्त भोज वेटलैंड बनाती है।"
      story: "1794 में नवाब हयात मुहम्मद खान बहादुर के मंत्री छोटे खान ने शहर की सुंदरता बढ़ाने के लिए कई पुराने कुओं को मिलाकर और 'पुल पुख्ता' नामक पत्थर के पुल-बांध के सहारे इस झील का निर्माण कराया। एक मिट्टी के बांध द्वारा अपर लेक से अलग यह झील सीढ़ीदार स्तर पर बनी है और लगभग 1.29 वर्ग किलोमीटर क्षेत्र में फैली है। साहित्य में इसे पुख्ता-पुल तालाब भी कहा गया है और यह पुराने भोपाल की विरासत तथा आधुनिक प्रशासनिक इलाकों के संगम पर स्थित है। रामसर भोज वेटलैंड का हिस्सा होने के बावजूद शहरी नालों के कारण यह झील पर्यावरणीय दबाव का सामना कर रही है।"
