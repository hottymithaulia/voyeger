    en:
      title: "Shaukat Mahal and Sadar Manzil"
      summary: "Standing side by side at the entrance to Old Bhopal's Chowk area near Iqbal Maidan, Shaukat Mahal and Sadar Manzil showcase the cosmopolitan royal architecture of Bhopal's 19th-century Begums."
      story: "Shaukat Mahal, constructed under Sikandar Jahan Begum and associated with her residence alongside Nawab Jahangir Mohammed Khan, breaks sharply from surrounding Islamic architecture by fusing Gothic and post-Renaissance European elements with Indo-Islamic arches and elongated windows. Historical accounts attribute its design to a Frenchman linked to the Bourbon lineage of Bhopal. Immediately nearby stands Sadar Manzil, the Begums' former Hall of Public Audience (Darbar Hall), which later housed the Bhopal Municipal Corporation headquarters. Sadar Manzil Darbar Hall is designated a Madhya Pradesh State Protected Monument (S-MP-329), and both structures appear in INTACH's 2003 Bhopal built-heritage register."
