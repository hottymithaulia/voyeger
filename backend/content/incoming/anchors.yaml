  text:
    en:
      title: "Birla Mandir (Lakshmi Narayan Temple)"
      summary: "Birla Mandir, formally the Lakshmi Narayan Temple, crowns Arera Hills (Lakshminarayana Giri) in central Bhopal, offering panoramic views over both Old and New Bhopal alongside landscaped gardens."
      story: "Built by the Hindustan Charity Trust on hilly land granted during the tenure of Madhya Pradesh Chief Minister Dr. Kailashnath Katju, the temple's foundation stone was laid in 1960 and it was inaugurated in 1964 by Chief Minister Dwarka Prasad Mishra. Designed in the Nagara Shaili architectural tradition across roughly seven to eight acres of hilltop grounds, the ochre-and-red temple enshrines Lord Vishnu and Goddess Lakshmi, flanked by shrines to Shiva and Maa Jagdamba. Inside, carved marble panels depict mythological scenes inscribed with teachings from the Bhagavad Gita and Ramayana, while the adjacent Birla Museum houses antique stone sculptures from across Madhya Pradesh."
