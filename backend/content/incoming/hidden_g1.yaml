      story: "Built in 1965 to manage Bhopal's primary reservoir, Bhadbhada Dam stands at the southeastern corner of Upper Lake with a full tank level of 1,666.80 feet (508.04 metres). Its eleven sluice gates generally remain closed for most of the year and are opened during heavy monsoon rainfall to release surplus water into the Kaliasote River, a tributary of the Betwa basin. While official Bhopal tourism portals spotlight distant Kerwa Dam for outings, Bhadbhada Dam remains a quieter local engineering landmark close to Van Vihar National Park."
