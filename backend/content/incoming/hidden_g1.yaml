      story: "Founded by the Madhya Pradesh Department of Culture through the initiative of poet-administrator Ashok Vajpeyi and filmmaker Mani Kaul, the Kendra invited Dagar-tradition maestro Zia Fariduddin Dagar back from Europe to revive intensive Dhrupad training in Bhopal. Administered by the Ustad Alauddin Khan Sangeet Evam Kala Akademi, the institute trains scholars in four-year batches and has nurtured celebrated performers including Uday Bhawalkar and the Gundecha Brothers. Though central to India's modern Dhrupad revival, it rarely appears on tourist maps; visitors should verify locally when public recitals or visits are open."
