      title: "कुशाभाऊ ठाकरे हॉल (ऐतिहासिक मिंटो हॉल)"
      summary: "अरेरा हिल्स के पास लोअर लेक की ओर स्थित कुशाभाऊ ठाकरे हॉल (ऐतिहासिक मिंटो हॉल) 20वीं सदी के प्रारंभ का बेगम कालीन विरासत भवन है, जो लगभग चार दशकों तक मध्यप्रदेश विधानसभा का स्थल रहा।"
      story: "भोपाल की चौथी बेगम नवाब सुल्तान जहाँ बेगम की परिकल्पना और वास्तुकार ए. सी. रोवन के डिज़ाइन पर आधारित इस भवन की आधारशिला 12 नवंबर 1909 को रखी गई और इसका निर्माण उनके पुत्र नवाब हमीदुल्लाह खान के समय पूरा हुआ। इंटैक (INTACH) की 2003 की सूची में मिंटो हॉल (#204) के रूप में दर्ज यह भव्य इमारत करीब चार दशकों तक राज्य की विधानसभा रही। वर्तमान में इसे कुशाभाऊ ठाकरे अंतरराष्ट्रीय कन्वेंशन सेंटर के रूप में संरक्षित किया गया है, जहाँ छत पर लोअर लेक के दृश्य वाला रेस्तरां '1909 – द क्राउन ऑफ भोपाल' भी स्थित है।"
      tips: "स्थानीय स्तर पर पुष्टि करें"
