      story: "Operating as a zonal cultural centre in Madhya Pradesh with artists based in Bhopal, the academy conducts field surveys, publishes documentation on indigenous traditions, and hosts major state festivals including Lokrang, Ram Leela Mela, Nimad Utsav, Sampada, and Shruti Samaroh. It has also provided an artistic workspace in Bhopal for noted tribal painter Lado Bai and established off-site museums at Orchha. Because casual drop-in visitor access outside scheduled festivals and exact campus coordinates are unconfirmed in public sources, it is classified under culture rather than hidden_gem."
