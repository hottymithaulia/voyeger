      summary: "Opened on 2 December 2014 on the 30th anniversary of the 1984 Bhopal Gas Tragedy, the Remember Bhopal Museum is a survivor-curated memorial museum preserving personal artefacts, oral histories, and protest records."
      story: "Founded by the Remember Bhopal Trust without government or corporate funding and curated by journalist-museologist Rama Lakshmi alongside coordinator Shalini Sharma, the museum occupies a converted residence in Karond roughly 2.5 kilometres from the former Union Carbide factory. Its exhibits bring together personal belongings donated by victims' families—such as clothing and a stopped pocket watch—alongside photographs, campaign posters, and recorded survivor accounts. Described by its curator as India's first museum focused on a contemporary social movement for justice, it is classified as culture because its ~3.4 km distance from Taj-ul-Masajid falls slightly outside the ~3 km hidden-gem radius."
