  hi:
    title: भदभदा डैम
    summary: अपर लेक के दक्षिण-पूर्वी कोने पर 1965 में निर्मित भदभदा डैम ग्यारह गेट वाला एक प्रमुख बांध है, जो भोजताल के अतिरिक्त जल को कलियासोत नदी की ओर नियंत्रित करता है।
    story: भोपाल के प्रमुख जलाशय के जल स्तर प्रबंधन के लिए 1965 में बने इस बांध का पूर्ण टैंक स्तर 1,666.80 फीट (508.04 मीटर) है। इसके ग्यारह स्लुइस गेट सामान्यतः वर्ष के अधिकांश समय बंद रहते हैं और भारी मानसूनी वर्षा के दौरान अतिरिक्त पानी को कलियासोत नदी में छोड़ने के लिए खोले जाते हैं। जहाँ आधिकारिक पर्यटन सूचियाँ अक्सर केरवा डैम को प्रमुखता देती हैं, वहीं वन विहार राष्ट्रीय उद्यान के करीब स्थित भदभदा डैम एक अपेक्षाकृत कम प्रचारित स्थानीय जल-अभियांत्रिकी स्थल है।
