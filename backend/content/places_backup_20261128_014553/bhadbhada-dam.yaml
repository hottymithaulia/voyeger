text:
  en:
    title: Bhadbhada Dam
    summary: Constructed in 1965 at the southeastern outlet of Upper Lake, Bhadbhada Dam is an eleven-gate spillway that regulates water flow from Bhojtal into the Kaliasote River.
    story: Built in 1965 to manage Bhopal's primary reservoir, Bhadbhada Dam stands at the southeastern corner of Upper Lake with a full tank level of 1,666.80 feet (508.04 metres). Its eleven sluice gates generally remain closed for most of the year and are opened during heavy monsoon rainfall to release surplus water into the Kaliasote River, a tributary of the Betwa basin.
