text:
  en:
    title: Taj-ul-Masajid
    summary: Taj-ul-Masajid, meaning the 'Crown of Mosques', is one of India's largest mosques and a monumental pink sandstone landmark in Old Bhopal's Shahjahanabad quarter. Initiated by Nawab Shah Jahan Begum, its twin minarets and triple domes anchor the city's historic skyline.
    story: Construction of Taj-ul-Masajid began under Nawab Shah Jahan Begum in the newly laid walled suburb of Shahjahanabad during the late 19th century, with historical accounts estimating initial work around 1871 and groundbreaking in 1887 before final completion in 1958. Spanning an interior area of about 13,000 square metres with capacity for roughly 26,000 worshippers, the mosque rises with two 67-metre minarets, three large domes, and 27 ceilings held aloft by massive arched pillars. Notably for its era, the complex incorporates a dedicated zenana prayer space for women, and its entrance was later renovated using 13th-century Syrian mosque motifs gifted by the Emir of Kuwait. From 1948 to 2001, the mosque grounds also hosted the annual Bhopal Tablighi Ijtema congregation.
