  hi:
    title: भारत भवन
    summary: भारत भवन भोपाल के श्यामला हिल्स में अपर लेक के सामने स्थित एक स्वायत्त बहु-कला केंद्र और संग्रहालय है। प्रसिद्ध वास्तुकार चार्ल्स कोरिया द्वारा डिज़ाइन किया गया यह परिसर दृश्य कला, रंगमंच, कविता, सिनेमा और शास्त्रीय संगीत का संगम है।
    story: 13 फरवरी 1982 को उद्घाटित और भारत भवन ट्रस्ट द्वारा संचालित यह परिसर जे. स्वामीनाथन मार्ग पर दृश्य एवं प्रदर्शन कलाओं, लोक कला तथा साहित्य के केंद्र के रूप में स्थापित किया गया था। अपर लेक के सामने चार्ल्स कोरिया द्वारा डिज़ाइन किए गए इस परिसर में अनेक कला दीर्घाएँ, एक मुक्ताकाश मंच, कार्यशालाएँ और पुस्तकालय शामिल हैं। इसके प्रमुख प्रभागों में समकालीन, लोक और जनजातीय कला का संग्रहालय 'रूपांकर', रंगमंच प्रभाग 'रंगमंडल', भारतीय कविता और साहित्य का पुस्तकालय 'वागर्थ', शास्त्रीय व लोक संगीत प्रभाग 'अनहद', शास्त्रीय सिनेमा केंद्र 'छवि' और रचनात्मक लेखन पीठ 'निराला सृजनपीठ' शामिल हैं।
