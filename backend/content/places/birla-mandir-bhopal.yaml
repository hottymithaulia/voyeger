    needs_review: true
  hi:
    title: बिरला मंदिर (लक्ष्मी नारायण मंदिर)
    summary: बिरला मंदिर, जिसे औपचारिक रूप से लक्ष्मी नारायण मंदिर कहा जाता है, मध्य भोपाल के अरेरा हिल्स (लक्ष्मीनारायण गिरि) के शिखर पर स्थित है और यहाँ से पुराने व नए भोपाल के विहंगम दृश्य दिखाई देते हैं।
    story: हिंदुस्तान चैरिटी ट्रस्ट द्वारा निर्मित इस मंदिर की आधारशिला 1960 में तत्कालीन मुख्यमंत्री डॉ. कैलाशनाथ काटजू ने रखी थी और इसका उद्घाटन 1964 में मुख्यमंत्री द्वारका प्रसाद मिश्र ने किया। लगभग सात से आठ एकड़ पहाड़ी क्षेत्र में नागर शैली में बने गेरुआ और लाल पत्थर के इस मंदिर में भगवान विष्णु और देवी लक्ष्मी की प्रतिमाएँ प्रतिष्ठित हैं, जबकि पार्श्व में शिव और माँ जगदंबा के मंदिर हैं। गर्भगृह और परिसर की संगमरमर की दीवारों पर पौराणिक दृश्य तथा भगवद गीता व रामायण के उपदेश अंकित हैं, और मंदिर के पास स्थित बिरला संग्रहालय में मध्यप्रदेश की प्राचीन पाषाण प्रतिमाएँ संरक्षित हैं।
