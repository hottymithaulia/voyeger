text:
  en:
    title: Yadgar-e-Shahjahani Park
    summary: Yadgar-e-Shahjahani Park is an Old Bhopal heritage green space linking Shahjahanabad's historic urban landscape with the modern civic history of Bhopal's gas-tragedy survivor movement.
    story: Catalogued as Yadgar-e-Shahjahani (#256) in INTACH's 2003 Bhopal built-heritage register and noted among the city's public parks on Bhopal's official district portal, the park sits near the historic Shahjahanabad quarter. Beyond its built-heritage listing, the grounds hold deep contemporary significance as the weekly meeting venue where activist Abdul Jabbar Khan organised survivors of the 1984 Bhopal Gas Tragedy and supported women-led livelihood work. Rarely mentioned in visitor guides, the park offers a reflective stop into Bhopal's layered civic memory.
    tips: []
    needs_review: true
  hi:
    title: यादगार-ए-शाहजहानी पार्क
    summary: यादगार-ए-शाहजहानी पार्क पुराने भोपाल का एक ऐतिहासिक सार्वजनिक उद्यान है, जो शाहजहानाबाद के ऐतिहासिक परिवेश को भोपाल गैस त्रासदी पीड़ितों के आधुनिक नागरिक आंदोलन की स्मृति से जोड़ता है।
    story: इंटैक (INTACH) की 2003 की भोपाल विरासत सूची (#256) और भोपाल जिला पोर्टल के उद्यानों की सूची में दर्ज यह पार्क ऐतिहासिक शाहजहानाबाद क्षेत्र के पास स्थित है। अपनी विरासत पहचान के अलावा, इस पार्क का आधुनिक सामाजिक इतिहास में विशेष महत्व है क्योंकि सामाजिक कार्यकर्ता अब्दुल जब्बार खान यहाँ 1984 की भोपाल गैस त्रासदी के पीड़ितों की साप्ताहिक बैठकें आयोजित करते थे। सामान्य पर्यटन गाइडों में कम चर्चित यह स्थान भोपाल की नागरिक स्मृति को समझने का एक शांत केंद्र है।
