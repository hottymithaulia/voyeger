text:
  en:
    title: Gauhar Mahal
    summary: 1820 lakeside palace built by Qudsia Begum blending Hindu and Mughal
      motifs.
    story: Commissioned by Bhopal's first female ruler, Gauhar Mahal's inner Diwan-e-Aam
      courtyard opens onto cooling lake breezes.
    tips:
    - Look up at the painted wooden ceilings in the upper jharokha.
    - Pair with a short walk toward VIP Road.
    needs_review: false
  hi:
    title: गौहर महल
    summary: 1820 में कुदसिया बेगम द्वारा बनवाया गया झील के किनारे स्थित ऐतिहासिक
      महल।
    story: भोपाल की पहली महिला शासिका द्वारा निर्मित यह महल हिंदू और मुगल स्थापत्य
      का सुंदर संगम है।
    tips:
    - ऊपरी झरोखे की चित्रित लकड़ी की छत अवश्य देखें।
    - पास की झील की सैर के साथ इसे जोड़ें।
