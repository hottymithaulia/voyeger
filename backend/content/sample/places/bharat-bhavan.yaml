text:
  en:
    title: Bharat Bhavan
    summary: Sunken multi-arts complex celebrating tribal, folk, and contemporary
      Indian art.
    story: Stepping gently down toward the Upper Lake, Bharat Bhavan houses Roopankar's
      Gond and Bhil collections alongside an open-air amphitheatre.
    tips:
    - Visit after 4 PM for gallery light and sunset over the lake.
    - Check gallery schedules before visiting.
