text:
  en:
    title: Lake View Walk
    summary: Breezy hillside promenade linking Shamla Hills with the southern shore
      of Bhojtal.
    story: Popular for unhurried evening strolls, this stretch frames views across
      the water toward Old Bhopal's minarets.
    tips:
    - Arrive 30 minutes before sunset for the best light.
    - Pair with a visit to Bharat Bhavan nearby.
    needs_review: false
