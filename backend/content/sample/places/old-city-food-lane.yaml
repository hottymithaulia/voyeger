text:
  en:
    title: Old City Food Lane
    summary: Evening food lane in Old Bhopal famous for Bhopali chaat, snacks, and
      salted chai.
    story: As dusk settles over Chowk Bazaar, samovars and coal sigris light up the
      lane with recipes passed down through family stalls.
    tips:
    - Arrive on foot from Peer Gate.
    - Carry small cash notes for street stalls.
    needs_review: false
  hi:
    title: पुराना शहर फूड लेन
    summary: पुराने भोपाल की शाम की फूड लेन, जो भोपाली चाट और नमकीन चाय के लिए प्रसिद्ध
      है।
    story: शाम ढलते ही चौक बाजार के पास यह गली पारंपरिक भोपाली व्यंजनों की खुशबू से
      महक उठती है।
    tips:
    - पीर गेट से पैदल आएं।
    - दुकानों के लिए छोटे नकद नोट साथ रखें।
