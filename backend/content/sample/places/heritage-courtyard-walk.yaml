      सैर।
    story: मुख्य बाजार से हटकर शांत आंगनों में आज भी पारंपरिक शिल्प स्टूडियो काम करते
      हैं।
    tips:
    - कार्यशाला देखने के लिए पहले से पूछें।
    - आरामदायक चलने वाले जूते पहनें।
