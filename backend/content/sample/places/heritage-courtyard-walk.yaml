text:
  en:
    title: Heritage Courtyard Walk
    summary: A slow walking loop connecting stone havelis, zardozi workshops, and
      lakeside gates.
    story: Tucked off the main bazaar arteries, quiet residential courtyards still
      host traditional craft studios and mid-day tea stops.
    tips:
    - Enquire ahead for artisan studio demonstrations.
    - Wear comfortable walking shoes.
    needs_review: false
