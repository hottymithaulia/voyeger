text:
  en:
    title: Sadar Manzil
    summary: Former Hall of Public Audience in the old walled city, framing lush courtyard
      gardens.
    story: Built during the Begums' reign as a civic audience hall, Sadar Manzil links
      Moti Masjid and Shaukat Mahal along a walkable heritage spine.
    tips:
    - Walk through early in the morning before market traffic builds.
    - Combine with Moti Masjid next door.
